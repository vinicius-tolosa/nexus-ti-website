{% extends "base.html" %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container">
        <h2 class="mb-4"><i class="fas fa-user-plus"></i> Cadastro de Cliente</h2>
        <p class="lead">Preencha o formulário abaixo para solicitar nossos serviços.</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <form id="formCadastro">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nome Completo *</label>
                                    <input type="text" class="form-control" name="nome_completo" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email *</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Telefone *</label>
                                    <input type="tel" class="form-control" name="telefone" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Documento (CPF/CNPJ)</label>
                                    <input type="text" class="form-control" name="documento">
                                </div>
                            </div>

                            <hr>

                            <h5 class="mb-3"><i class="fas fa-map-marker-alt"></i> Endereço</h5>

                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label class="form-label">CEP</label>
                                    <input type="text" class="form-control" name="cep">
                                </div>
                                <div class="col-md-9">
                                    <label class="form-label">Rua</label>
                                    <input type="text" class="form-control" name="rua">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label class="form-label">Número</label>
                                    <input type="text" class="form-control" name="numero">
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label">Bairro</label>
                                    <input type="text" class="form-control" name="bairro">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Complemento</label>
                                    <input type="text" class="form-control" name="complemento">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Cidade</label>
                                    <input type="text" class="form-control" name="cidade">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Estado</label>
                                    <input type="text" class="form-control" name="estado" maxlength="2">
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-check"></i> Enviar Cadastro
                                </button>
                            </div>
                        </form>

                        <div id="mensagem" class="alert mt-3" style="display:none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}

{% block scripts %}
<script>
document.getElementById('formCadastro').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(document.getElementById('formCadastro'));
    const mensagem = document.getElementById('mensagem');
    
    try {
        const response = await fetch('/cadastro-cliente', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        mensagem.style.display = 'block';
        if (data.success) {
            mensagem.className = 'alert alert-success';
            mensagem.innerHTML = '<i class="fas fa-check-circle"></i> ' + data.message;
            document.getElementById('formCadastro').reset();
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        } else {
            mensagem.className = 'alert alert-danger';
            mensagem.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + data.message;
        }
    } catch (error) {
        mensagem.style.display = 'block';
        mensagem.className = 'alert alert-danger';
        mensagem.innerHTML = '<i class="fas fa-exclamation-circle"></i> Erro ao processar cadastro';
    }
});
</script>
{% endblock %}
